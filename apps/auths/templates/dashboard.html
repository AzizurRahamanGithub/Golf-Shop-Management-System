{% extends "admin/index.html" %}
{% load static %}

{% block content %}
<div class="dashboard-cards">
    <div class="card card-bookings">
        <h3>Total Bookings</h3>
        <p>{{ total_bookings }}</p>
    </div>
    <div class="card card-users">
        <h3>Total Users</h3>
        <p>{{ total_users }}</p>
    </div>
    <div class="card card-earning">
        <h3>Total Earning</h3>
        <p>${{ total_earning }}</p>
    </div>
    <div class="card card-rental">
        <h3>Total Rentals</h3>
        <p>{{ total_rental }}</p>
    </div>
</div>
{% endblock %}

{% block extrastyle %}
<style>
.dashboard-cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}
.card {
    flex: 1 1 200px;
    padding: 20px;
    border-radius: 12px;
    color: white;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    font-family: sans-serif;
}
.card h3 {
    margin-bottom: 10px;
    font-size: 1.2rem;
}
.card p {
    font-size: 1.8rem;
    font-weight: bold;
}
.card-bookings { background: linear-gradient(90deg, #4ade80, #16a34a); }
.card-users { background: linear-gradient(90deg, #60a5fa, #1e3a8a); }
.card-earning { background: linear-gradient(90deg, #facc15, #b45309); }
.card-rental { background: linear-gradient(90deg, #f472b6, #be185d); }
</style>
{% endblock %}
