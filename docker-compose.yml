version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: django_db_yaribabieex3
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - django_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: django_redis_yaribabieex3
    networks:
      - django_net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_web_yaribabieex3
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8441 --workers 3 --timeout 180"
    volumes:
      - .:/app
      - static_volume:/app/config/staticfiles
    ports:
      - "8441:8441"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - django_net
    restart: unless-stopped

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_websocket_yaribabieex3
    command: >
      sh -c "daphne -b 0.0.0.0 -p 8842 config.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8842:8842"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - django_net
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_celery_yaribabieex3
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis
    networks:
      - django_net
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_celery_beat_yaribabieex3
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis
    networks:
      - django_net
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:

networks:
  django_net:
    driver: bridge


