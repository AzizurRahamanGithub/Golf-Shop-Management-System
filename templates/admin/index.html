{% comment %} {% extends "unfold/base.html" %}
{% load static %}

{% block content %}
<div class="p-6">
  <h1 class="text-2xl font-semibold mb-4">RyanGali Dashboard 🚀</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Example chart card -->
    <div class="unfold-card p-4">
      <h2 class="text-lg font-semibold mb-2">New Users (Last 7 days)</h2>
      <canvas id="usersChart" height="200"></canvas>
    </div>

    <!-- Example table card -->
    <div class="unfold-card p-4">
      <h2 class="text-lg font-semibold mb-2">Recent Bookings</h2>
      <table class="table-auto w-full">
        <thead>
          <tr>
            <th class="px-2 py-1">Booking ID</th>
            <th class="px-2 py-1">User</th>
            <th class="px-2 py-1">Status</th>
          </tr>
        </thead>
        <tbody>
          {% for b in recent_bookings %}
          <tr>
            <td class="px-2 py-1">{{ b.id }}</td>
            <td class="px-2 py-1">{{ b.user.username }}</td>
            <td class="px-2 py-1">{{ b.status }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('usersChart').getContext('2d');
  const usersChart = new Chart(ctx, {
      type: 'line',
      data: {
          labels: {{ last_7_days|safe }}, // e.g. ["2025-10-07", ...]
          datasets: [{
              label: 'New Users',
              data: {{ new_users_count|safe }},
              borderColor: 'rgb(99, 102, 241)',
              backgroundColor: 'rgba(99, 102, 241, 0.2)',
              fill: true,
              tension: 0.3
          }]
      },
      options: {
          responsive: true,
          plugins: {
              legend: { position: 'top' },
          },
          scales: {
              y: { beginAtZero: true }
          }
      }
  });
</script>
{% endblock %} {% endcomment %}
